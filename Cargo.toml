[package]
name = "ftop"
version = "0.1.0"
edition = "2021"
description = "A real-time top-like terminal directory explorer tracking filesystem changes"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["tui", "filesystem", "top", "watcher", "ratatui"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
notify = "6.1"
chrono = "0.4"
